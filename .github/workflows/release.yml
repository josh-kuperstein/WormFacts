name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check .toc version matches tag
        run: |
          toc=$(sed -n 's/^## Version: *//p' WormFacts.toc | tr -d '\r')
          [ "$toc" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::tag $GITHUB_REF_NAME != toc $toc"; exit 1; }

      - name: Build zip
        run: git archive --format=zip --prefix=WormFacts/ -o "WormFacts-$GITHUB_REF_NAME.zip" HEAD WormFacts.toc WormFacts.lua Config.lua Data

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "WormFacts-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
